name: CI/CD Dashboard PTEP

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dashboard-ptep
  cancel-in-progress: false

jobs:
    ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    deploy:
    name: Deploy to Ubuntu Server
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="/var/www/html/sipenta/tatausaha-dashboard"

          cd "$APP_DIR"

          echo "=== Backup informasi commit sebelumnya ==="
          git rev-parse HEAD

          echo "=== Update kode dari GitHub ==="
          git fetch origin master
          git reset --hard origin/master

          echo "=== Install dependencies ==="
          npm ci

          echo "=== Build production ==="
          npm run build

          echo "=== Reload aplikasi PM2 ==="
          pm2 reload dashboard-ptepp

          echo "=== Status PM2 ==="
          pm2 status dashboard-ptepp
